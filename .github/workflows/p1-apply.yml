name: Apply P1 LCB Alignment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p1-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply P1 contract alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              text2 = text.replace(old, new, 1)
              p.write_text(text2)

          runtime = Path('src/runtime.ts')
          text = runtime.read_text()
          if not text.startswith('import { randomUUID } from "node:crypto";'):
              text = 'import { randomUUID } from "node:crypto";\n\n' + text
          runtime.write_text(text)

          replace_once('src/runtime.ts', '''export interface RuntimeEvent {\n  cursor: number;\n  at: string;\n  method: string;\n  category: EventCategory;\n  turn_id?: string;\n  data: unknown;\n}\n''', '''export interface RuntimeEvent {\n  cursor: number;\n  at: string;\n  method: string;\n  category: EventCategory;\n  turn_id?: string;\n  data: unknown;\n}\n\nexport interface ProjectedRuntimeEvent extends RuntimeEvent {\n  schema_version: 1;\n  stream_id: string;\n  event_id: string;\n  worker: "codex";\n  source: "lcb.codex-app-server";\n  type: string;\n  native_type: string;\n  observed_at: string;\n  occurred_at: null;\n  scope: { thread_id: string; turn_id?: string };\n  transport: { bounded: true; sanitized: true };\n}\n''')

          replace_once('src/runtime.ts', '''interface ThreadRuntime {\n  threadId: string;\n  activeTurnId: string | null;\n''', '''interface ThreadRuntime {\n  threadId: string;\n  streamId: string;\n  activeTurnId: string | null;\n''')

          replace_once('src/runtime.ts', '''export interface RuntimeObservation {\n  runtime_available: true;\n  runtime_status: string;\n  active_turn_id: string | null;\n  events: RuntimeEvent[];\n''', '''export interface RuntimeObservation {\n  runtime_available: true;\n  runtime_status: string;\n  active_turn_id: string | null;\n  stream_id: string;\n  requested_stream_id: string | null;\n  stream_changed: boolean;\n  events: ProjectedRuntimeEvent[];\n''')

          replace_once('src/runtime.ts', '''function idKey(id: RpcId): string {\n  return `${typeof id}:${String(id)}`;\n}\n''', '''function idKey(id: RpcId): string {\n  return `${typeof id}:${String(id)}`;\n}\n\nfunction normalizeEventType(method: string): string {\n  const normalized = method\n    .toLowerCase()\n    .replace(/[^a-z0-9._-]+/g, ".")\n    .replace(/\\.+/g, ".")\n    .replace(/^\\.|\\.$/g, "");\n  return `codex.${normalized || "native_event"}`;\n}\n\nfunction pendingKind(method: string): "action_approval" | "permission_grant" | "user_input" | "unknown" {\n  if (method === "item/commandExecution/requestApproval" ||\n      method === "item/fileChange/requestApproval" ||\n      method === "execCommandApproval" ||\n      method === "applyPatchApproval") return "action_approval";\n  if (method === "item/permissions/requestApproval") return "permission_grant";\n  if (method === "item/tool/requestUserInput") return "user_input";\n  return "unknown";\n}\n\nfunction pendingResponseContract(method: string): unknown {\n  const kind = pendingKind(method);\n  if (kind === "action_approval") {\n    return {\n      type: "action_decision",\n      allowed_decisions: ["accept", "acceptForSession", "decline", "cancel"],\n      execpolicy_amendment: method === "item/commandExecution/requestApproval" || method === "execCommandApproval",\n    };\n  }\n  if (kind === "permission_grant") {\n    return { type: "permission_grant", allowed_scopes: ["turn", "session"] };\n  }\n  if (kind === "user_input") {\n    return { type: "user_input", accepts: ["answers", "response"] };\n  }\n  return null;\n}\n''')

          replace_once('src/runtime.ts', '''      this.#threads.set(threadId, {\n        threadId,\n        activeTurnId: null,\n''', '''      this.#threads.set(threadId, {\n        threadId,\n        streamId: randomUUID(),\n        activeTurnId: null,\n''')

          old_observe = '''  observe(\n    threadId: string,\n    cursor: number | undefined,\n    limit: number,\n  ): RuntimeObservation | null {\n    const runtime = this.#threads.get(threadId);\n    if (!runtime) {\n      return null;\n    }\n    const current = runtime.nextCursor - 1;\n    const firstAvailable = runtime.events[0]?.cursor ?? runtime.nextCursor;\n    const requested = cursor ?? firstAvailable - 1;\n    const cursorLost = requested < firstAvailable - 1;\n    const effective = cursorLost ? firstAvailable - 1 : requested;\n    const available = runtime.events.filter((event) => event.cursor > effective);\n    const events = available.slice(0, limit);\n    const nextCursor = events.at(-1)?.cursor ?? Math.min(Math.max(effective, 0), current);\n    return {\n      runtime_available: true,\n      runtime_status: runtime.status,\n      active_turn_id: runtime.activeTurnId,\n      events,\n      next_cursor: nextCursor,\n      current_cursor: current,\n      cursor_floor: Math.max(0, firstAvailable - 1),\n      cursor_lost: cursorLost,\n      has_more: available.length > events.length,\n      pending_requests: this.pendingForThread(threadId),\n      terminal: runtime.terminal,\n    };\n  }\n'''
          new_observe = '''  observe(\n    threadId: string,\n    cursor: number | undefined,\n    limit: number,\n    streamId?: string,\n  ): RuntimeObservation | null {\n    const runtime = this.#threads.get(threadId);\n    if (!runtime) {\n      return null;\n    }\n    const current = runtime.nextCursor - 1;\n    const firstAvailable = runtime.events[0]?.cursor ?? runtime.nextCursor;\n    const requested = cursor ?? firstAvailable - 1;\n    const streamChanged = streamId !== undefined && streamId !== runtime.streamId;\n    const cursorLost = streamChanged || requested < firstAvailable - 1;\n    const effective = cursorLost ? firstAvailable - 1 : requested;\n    const available = runtime.events.filter((event) => event.cursor > effective);\n    const rawEvents = available.slice(0, limit);\n    const events: ProjectedRuntimeEvent[] = rawEvents.map((event) => ({\n      ...event,\n      schema_version: 1,\n      stream_id: runtime.streamId,\n      event_id: `${runtime.streamId}:${event.cursor}`,\n      worker: "codex",\n      source: "lcb.codex-app-server",\n      type: normalizeEventType(event.method),\n      native_type: event.method,\n      observed_at: event.at,\n      occurred_at: null,\n      scope: { thread_id: threadId, ...(event.turn_id ? { turn_id: event.turn_id } : {}) },\n      transport: { bounded: true, sanitized: true },\n    }));\n    const nextCursor = rawEvents.at(-1)?.cursor ?? Math.min(Math.max(effective, 0), current);\n    return {\n      runtime_available: true,\n      runtime_status: runtime.status,\n      active_turn_id: runtime.activeTurnId,\n      stream_id: runtime.streamId,\n      requested_stream_id: streamId ?? null,\n      stream_changed: streamChanged,\n      events,\n      next_cursor: nextCursor,\n      current_cursor: current,\n      cursor_floor: Math.max(0, firstAvailable - 1),\n      cursor_lost: cursorLost,\n      has_more: available.length > rawEvents.length,\n      pending_requests: this.pendingForThread(threadId),\n      terminal: runtime.terminal,\n    };\n  }\n'''
          replace_once('src/runtime.ts', old_observe, new_observe)

          replace_once('src/runtime.ts', '''  async observeWithWait(\n    threadId: string,\n    cursor: number | undefined,\n    limit: number,\n    waitMs: number,\n    signal?: AbortSignal,\n  ): Promise<RuntimeObservation | null> {\n''', '''  async observeWithWait(\n    threadId: string,\n    cursor: number | undefined,\n    limit: number,\n    waitMs: number,\n    signal?: AbortSignal,\n    streamId?: string,\n  ): Promise<RuntimeObservation | null> {\n''')
          replace_once('src/runtime.ts', '''    const initial = this.observe(threadId, cursor, limit);\n''', '''    const initial = this.observe(threadId, cursor, limit, streamId);\n''')
          replace_once('src/runtime.ts', '''    return this.observe(threadId, cursor, limit);\n  }\n\n  pendingForThread(threadId: string): unknown[] {\n''', '''    return this.observe(threadId, cursor, limit, streamId);\n  }\n\n  pendingForThread(threadId: string): unknown[] {\n''')

          old_pending = '''      .map((request) => ({\n        request_id: request.rawId,\n        method: request.method,\n        thread_id: request.threadId,\n        turn_id: request.turnId ?? null,\n        received_at: request.receivedAt,\n        params: request.params,\n      }));\n'''
          new_pending = '''      .map((request) => {\n        const kind = pendingKind(request.method);\n        return {\n          schema_version: 1,\n          request_id: request.rawId,\n          worker: "codex",\n          kind,\n          native_method: request.method,\n          blocking: true,\n          created_at: request.receivedAt,\n          expires_at: null,\n          failure_policy: "none",\n          scope: {\n            thread_id: request.threadId,\n            ...(request.turnId ? { turn_id: request.turnId } : {}),\n            native_request_ref: request.rawId,\n          },\n          presentation: { method: request.method },\n          payload: request.params,\n          response_contract: pendingResponseContract(request.method),\n          // Legacy compatibility fields retained during Contract v1 migration.\n          method: request.method,\n          thread_id: request.threadId,\n          turn_id: request.turnId ?? null,\n          received_at: request.receivedAt,\n          params: request.params,\n        };\n      });\n'''
          replace_once('src/runtime.ts', old_pending, new_pending)

          replace_once('src/tools.ts', '''        cursor: {\n          type: "integer",\n          minimum: 0,\n          description: "Return runtime events with a cursor greater than this value.",\n        },\n''', '''        cursor: {\n          type: "integer",\n          minimum: 0,\n          description: "Return runtime events with a cursor greater than this value.",\n        },\n        stream_id: {\n          type: "string",\n          minLength: 1,\n          maxLength: 200,\n          description: "Optional stream identity from a prior observe. A mismatch is disclosed as stream_changed/cursor_lost.",\n        },\n''')
          replace_once('src/tools.ts', '''    onlyKeys(args, ["thread_id", "cursor", "limit", "wait_ms"]);\n    const threadId = requiredString(args, "thread_id", 200);\n    const cursor = optionalInteger(args, "cursor", 0, Number.MAX_SAFE_INTEGER);\n''', '''    onlyKeys(args, ["thread_id", "cursor", "stream_id", "limit", "wait_ms"]);\n    const threadId = requiredString(args, "thread_id", 200);\n    const cursor = optionalInteger(args, "cursor", 0, Number.MAX_SAFE_INTEGER);\n    const streamId = optionalString(args, "stream_id", 200);\n''')
          replace_once('src/tools.ts', '''      ? this.appServer.runtime.observe(threadId, cursor, limit)\n      : await this.appServer.runtime.observeWithWait(threadId, cursor, limit, waitMs, signal);\n''', '''      ? this.appServer.runtime.observe(threadId, cursor, limit, streamId)\n      : await this.appServer.runtime.observeWithWait(threadId, cursor, limit, waitMs, signal, streamId);\n''')
          replace_once('src/tools.ts', '''      active_turn_id: null,\n      events: [],\n''', '''      active_turn_id: null,\n      stream_id: null,\n      requested_stream_id: streamId ?? null,\n      stream_changed: streamId !== undefined,\n      events: [],\n''')
          replace_once('src/tools.ts', '''    return {\n      responded: true,\n      request_id: requestId,\n      thread_id: threadId,\n      turn_id: pending.turnId ?? null,\n      method,\n    };\n''', '''    return {\n      responded: true,\n      acknowledgement: "accepted",\n      resolution: "submitted",\n      worker: "codex",\n      request_id: requestId,\n      thread_id: threadId,\n      turn_id: pending.turnId ?? null,\n      method,\n    };\n''')

          contract_test = r'''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport { RuntimeStore } from "../src/runtime.js";\n\ntest("Contract v1 projects Codex events with stable stream identity and detects stream change", () => {\n  const runtime = new RuntimeStore(8);\n  runtime.markTurnAccepted("thread-contract", "turn-contract");\n  runtime.recordNotification("item/started", {\n    threadId: "thread-contract",\n    turnId: "turn-contract",\n    item: { type: "commandExecution", apiKey: "secret" },\n  });\n\n  const first = runtime.observe("thread-contract", 0, 10)!;\n  assert.equal(first.stream_changed, false);\n  assert.equal(typeof first.stream_id, "string");\n  assert.equal(first.events.length, 1);\n  const event = first.events[0]!;\n  assert.equal(event.schema_version, 1);\n  assert.equal(event.worker, "codex");\n  assert.equal(event.source, "lcb.codex-app-server");\n  assert.equal(event.native_type, "item/started");\n  assert.equal(event.type, "codex.item.started");\n  assert.equal(event.stream_id, first.stream_id);\n  assert.equal(event.event_id, `${first.stream_id}:1`);\n  assert.equal(event.observed_at, event.at);\n  assert.deepEqual(event.scope, { thread_id: "thread-contract", turn_id: "turn-contract" });\n  assert.equal(event.transport.sanitized, true);\n  assert.equal(((event.data as Record<string, unknown>).item as Record<string, unknown>).apiKey, "[REDACTED]");\n\n  const changed = runtime.observe("thread-contract", first.next_cursor, 10, "stale-stream")!;\n  assert.equal(changed.stream_changed, true);\n  assert.equal(changed.cursor_lost, true);\n});\n\ntest("Contract v1 projects typed Codex HITL metadata while retaining native scope", () => {\n  const runtime = new RuntimeStore();\n  runtime.markTurnAccepted("thread-hitl", "turn-hitl");\n  runtime.recordServerRequest("req-1", "item/commandExecution/requestApproval", {\n    threadId: "thread-hitl",\n    turnId: "turn-hitl",\n    command: "echo ok",\n  });\n  runtime.recordServerRequest("req-2", "item/permissions/requestApproval", {\n    threadId: "thread-hitl",\n    turnId: "turn-hitl",\n    permissions: { network: true },\n  });\n  runtime.recordServerRequest("req-3", "item/tool/requestUserInput", {\n    threadId: "thread-hitl",\n    turnId: "turn-hitl",\n    questions: [],\n  });\n\n  const pending = runtime.pendingForThread("thread-hitl") as Array<Record<string, any>>;\n  assert.deepEqual(pending.map((item) => item.kind), ["action_approval", "permission_grant", "user_input"]);\n  assert.equal(pending[0]?.response_contract.type, "action_decision");\n  assert.equal(pending[1]?.response_contract.type, "permission_grant");\n  assert.equal(pending[2]?.response_contract.type, "user_input");\n  assert.equal(pending[0]?.scope.native_request_ref, "req-1");\n  assert.equal(pending[0]?.method, "item/commandExecution/requestApproval");\n});\n'''.replace('\\n', '\n')
          Path('test/contract-v1.test.ts').write_text(contract_test)

          replace_once('package.json', '''dist/test/runtime.test.js dist/test/app-server.test.js''', '''dist/test/runtime.test.js dist/test/contract-v1.test.js dist/test/app-server.test.js''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit aligned implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-apply.yml
          git add src/runtime.ts src/tools.ts test/contract-v1.test.ts package.json
          git commit -m "feat: align LCB with tri-bridge contract v1"
          git push
